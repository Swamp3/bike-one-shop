<script>try{ document.addEventListener("DOMContentLoaded", function () {
  // Find the sidebar / filter area
  const sidebar =
    document.querySelector(".sidebar-product-filters") ||
    document.getElementById("sidebar_primary");

  if (!sidebar) return;

  // On mobile: move sidebar ABOVE the product list
  if (window.innerWidth <= 991) {
    const products = document.querySelector(
      ".woocommerce ul.products, .woocommerce-page ul.products"
    );

    if (products && products.parentNode) {
      products.parentNode.insertBefore(sidebar, products);
    }
  }

  // Create the hamburger toggle
  const toggle = document.createElement("div");
  toggle.className = "filter-toggle";
  toggle.textContent = "Filter anzeigen";

  // Insert toggle directly before the sidebar
  sidebar.parentNode.insertBefore(toggle, sidebar);

  // Toggle visibility on click
  toggle.addEventListener("click", function () {
    sidebar.classList.toggle("active");
    toggle.textContent = sidebar.classList.contains("active")
      ? "Filter ausblenden"
      : "Filter anzeigen";
  });
});
 }catch (ex){}</script>
